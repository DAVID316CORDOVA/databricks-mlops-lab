name: CI

# Se ejecuta en cada pull request y en cada push a main.
# No toca Databricks: solo comprueba que el codigo esta bien.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4          # Spark local necesita Java
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: ruff check .                    # estilo y errores tipicos
      - run: pytest -q                       # tests con Spark local

  validate-bundle:
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t staging    # el YAML es valido para el workspace
